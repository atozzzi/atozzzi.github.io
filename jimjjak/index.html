<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>짐짝클럽 · 올 한 해 나의 짐짝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap">
<style>
  :root{
    --cream:#fbf4eb; --cream-2:#f5e8d8; --paper:rgba(255,251,246,.9);
    --ink:#4e3b2c; --ink-soft:#8a7262; --gold:#c39a68; --gold-soft:rgba(195,154,104,.35);
    --peach:#efc29b; --glow:#ffe2c2; --blue:#a9bed8; --blue-deep:#7f9cc0;
    --serif:"Gowun Batang",serif;
    --sans:"Gowun Dodum",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);color:var(--ink);background:var(--cream);word-break:keep-all;overflow-wrap:anywhere}
  button{font:inherit;cursor:pointer}
  [hidden]{display:none!important}

  /* ── 로고 ── */
  .logo{display:inline-flex;flex-direction:column;align-items:center;color:#fffaf3;
        filter:drop-shadow(0 0 4px rgba(255,214,170,.95)) drop-shadow(0 0 14px rgba(240,170,110,.65))}
  .logo svg.bag{width:30px;height:24px;margin-bottom:-2px}
  .logo .word{font-family:var(--sans);font-size:40px;letter-spacing:.02em;line-height:1.1}
  .logo svg.wave{width:150px;height:14px;margin-top:-2px}
  .logo.dark{color:#b07b4f;filter:drop-shadow(0 0 6px rgba(255,220,180,.9))}

  /* ── 대형 화면 ── */
  .stage{position:relative;height:100vh;overflow:hidden;background:#e9cfb4 url("img/bg-room.jpg") center/cover no-repeat}
  .stage::before{content:"";position:absolute;inset:0;
    background:linear-gradient(110deg,rgba(251,244,235,.35) 0%,rgba(251,244,235,.5) 45%,rgba(251,244,235,.62) 100%);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .bokeh{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,226,190,.75),rgba(255,226,190,0) 70%);
    animation:float var(--d,18s) ease-in-out infinite alternate}
  @keyframes float{from{transform:translate(0,0)}to{transform:translate(var(--x,30px),var(--y,-40px))}}

  .wall{position:relative;display:grid;grid-template-columns:clamp(280px,24vw,400px) 1fr;height:100%}
  .wall.demo{grid-template-columns:clamp(260px,21vw,360px) 1fr 360px}

  .side{
    padding:clamp(24px,2.6vw,44px) clamp(22px,2.4vw,40px);display:flex;flex-direction:column;gap:24px;overflow-y:auto;
    background:rgba(255,250,244,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-right:1px solid rgba(255,255,255,.7);box-shadow:8px 0 40px rgba(160,110,70,.08)
  }
  .side .brand{align-self:flex-start;background:radial-gradient(120% 140% at 50% 30%,rgba(196,140,96,.62),rgba(150,105,70,.5));border-radius:22px;padding:14px 24px 10px;box-shadow:0 0 40px rgba(240,180,120,.35)}
  .side h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,2.3vw,40px);line-height:1.4;margin:0;letter-spacing:-.01em}
  .side h1 em{font-style:normal;color:#b07b4f;background:linear-gradient(transparent 62%,rgba(239,194,155,.55) 62%)}
  .side p{margin:0;color:var(--ink-soft);font-size:clamp(14px,1vw,17px);line-height:1.75}
  .qr{background:#fffdf9;padding:16px 16px 12px;border-radius:22px;box-shadow:0 12px 34px rgba(150,100,60,.16);border:1px solid var(--gold-soft)}
  .qr #qrcode{display:flex;justify-content:center}
  .qr #qrcode img,.qr #qrcode canvas{width:100%!important;height:auto!important;max-width:280px}
  .qr .cap{margin-top:10px;font-size:13px;color:var(--ink-soft);text-align:center}
  .qr .url{margin-top:4px;font-size:11px;color:#b9a594;text-align:center;word-break:break-all}
  .count{font-family:var(--serif);font-size:clamp(15px,1.1vw,19px)}
  .count b{font-size:2em;color:#b07b4f;margin-right:4px;font-weight:700}
  .tools{margin-top:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .mode{font-size:12px;color:var(--ink-soft)}
  .mode.on::before{content:"●";color:#6aa86f;margin-right:5px}
  .mode.off::before{content:"●";color:#d4a04f;margin-right:5px}
  .mode.demo::before{content:"●";color:#c0623a;margin-right:5px}
  .btn-ghost{border:1px solid var(--gold-soft);background:rgba(255,255,255,.5);color:var(--ink-soft);padding:7px 16px;border-radius:999px;font-size:13px}
  .btn-ghost.armed{background:#c98b5e;border-color:#c98b5e;color:#fff}

  .board{position:relative;overflow-y:auto;padding:clamp(28px,3vw,52px)}
  .grid{columns:clamp(230px,19vw,330px);column-gap:26px}
  .empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;color:var(--ink-soft);font-family:var(--serif);font-size:clamp(17px,1.3vw,22px);line-height:1.8}
  .empty .candle{width:70px;height:96px}

  .card{display:inline-block;width:100%;break-inside:avoid;margin:34px 0 34px;position:relative}
  .card.p0{--c:#cddbec;--cd:#b6c8df;--s:#9db3cf}
  .card.p1{--c:#f7dfca;--cd:#eecaac;--s:#dcad89}
  .card.p2{--c:#f6eddf;--cd:#eadbc3;--s:#cfb592}
  .card.p3{--c:#dbe4d2;--cd:#c7d5bc;--s:#a8ba98}
  .card.p4{--c:#f4dcd8;--cd:#e9c6c0;--s:#d1a39c}
  .card .handle{position:absolute;top:-25px;left:50%;transform:translateX(-50%);width:92px;height:31px;
    border:7px solid var(--s);border-bottom:0;border-radius:18px 18px 0 0}
  .card .body{position:relative;overflow:hidden;border-radius:24px;padding:28px 46px 28px;
    background:linear-gradient(180deg,var(--c) 0%,var(--cd) 100%);
    border:1px solid rgba(90,60,35,.08);
    box-shadow:0 18px 34px rgba(120,80,50,.18),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -7px 0 rgba(90,60,35,.06)}
  .card .body::before,.card .body::after{content:"";position:absolute;top:0;bottom:0;width:12px;
    background:linear-gradient(180deg,transparent 18px,#e3c48f 18px,#e3c48f 32px,transparent 32px),var(--s);opacity:.75}
  .card .body::before{left:18px}
  .card .body::after{right:18px}
  .card .tag{position:relative;display:inline-block;margin:0 0 12px -6px;padding:5px 14px 5px 24px;
    background:#fffaf2;border:1px solid rgba(195,154,104,.5);border-radius:5px 14px 14px 5px;
    font-size:clamp(13px,.95vw,15px);color:#8a6544;transform:rotate(-2.5deg);box-shadow:0 3px 8px rgba(120,80,50,.12)}
  .card .tag::before{content:"";position:absolute;left:9px;top:50%;width:7px;height:7px;margin-top:-4px;border-radius:50%;
    background:var(--c);border:1px solid rgba(195,154,104,.7)}
  .card .burden{font-family:var(--serif);font-weight:700;font-size:clamp(20px,1.55vw,28px);line-height:1.45;color:#3f2f22;white-space:pre-wrap}
  .card .story{margin-top:14px;font-size:clamp(14px,1vw,17px);line-height:1.8;white-space:pre-wrap;color:#5e4a3b;
    background:rgba(255,252,247,.62);border-radius:14px;padding:10px 14px}
  .card .story:empty{display:none}
  .card .wheel{position:absolute;bottom:-8px;width:16px;height:16px;border-radius:50%;background:#7a6455;box-shadow:inset 0 0 0 4px #9c8676}
  .card .wheel.l{left:34px}.card .wheel.r{right:34px}
  .card .del{position:absolute;bottom:6px;right:34px;border:0;background:transparent;color:rgba(90,60,35,.45);font-size:16px;line-height:1;padding:4px;opacity:0;transition:opacity .2s}
  .card:hover .del{opacity:1}
  .card.new{animation:arrive 1.2s cubic-bezier(.2,1.3,.4,1)}
  .card.new .body{animation:glow 1.6s ease-out}
  @keyframes arrive{0%{opacity:0;transform:translateY(-50px)}60%{opacity:1}100%{transform:none}}
  @keyframes glow{0%,30%{box-shadow:0 0 0 6px rgba(255,214,170,.6),0 0 50px rgba(255,190,130,.65)}100%{box-shadow:0 18px 34px rgba(120,80,50,.18),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -7px 0 rgba(90,60,35,.06)}}

  /* 체험 모드: 가상 휴대폰 */
  .phone-col{position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:12px;overflow-y:auto;
    background:rgba(255,250,244,.35);border-left:1px solid rgba(255,255,255,.7)}
  .phone-col .tag{font-size:12px;color:var(--ink-soft);letter-spacing:.04em}
  .phone{width:320px;border-radius:40px;background:#2a211b;padding:11px;box-shadow:0 20px 50px rgba(90,60,35,.3)}
  .phone .screen{background:var(--cream);border-radius:30px;height:620px;overflow-y:auto}

  @media (max-width:1000px){
    .stage{height:auto;min-height:100vh;overflow:visible}
    .wall,.wall.demo{grid-template-columns:1fr;height:auto}
    .side{border-right:0}
    .qr{max-width:280px;align-self:center}
    .phone-col{order:-1}
  }

  /* ── 참여자 입력 ── */
  .write-page{min-height:100%;background:var(--cream)}
  .hero{position:relative;height:210px;background:url("img/header.jpg") center 40%/cover;display:flex;align-items:flex-start;justify-content:flex-end;padding:18px 18px 0}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,50,30,.08) 0%,rgba(251,244,235,0) 45%,var(--cream) 100%)}
  .hero .logo{position:relative;z-index:1}
  .hero .logo .word{font-size:28px}
  .hero .logo svg.bag{width:22px;height:18px}
  .hero .logo svg.wave{width:104px}
  .write{max-width:560px;margin:-36px auto 0;padding:0 22px 34px;position:relative}
  .write h1{font-family:var(--serif);font-weight:700;font-size:25px;line-height:1.4;margin:0 0 8px}
  .write h1 em{font-style:normal;color:#b07b4f}
  .write .lead{color:var(--ink-soft);margin:0 0 24px;line-height:1.7;font-size:14px}
  .field{margin-bottom:18px}
  .field label{display:block;margin-bottom:8px;font-size:15px;font-weight:700}
  .field label small{font-weight:400;color:var(--ink-soft);margin-left:4px}
  .field textarea,.field input{width:100%;border:1px solid var(--gold-soft);border-radius:14px;background:#fffdf9;padding:13px 15px;font:inherit;font-size:16px;line-height:1.6;color:var(--ink);box-shadow:0 2px 10px rgba(150,100,60,.05)}
  .field textarea{resize:vertical}
  .field textarea:focus,.field input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(239,194,155,.35)}
  .field ::placeholder{color:#c2ae9c}
  .field .meta{text-align:right;font-size:12px;color:var(--ink-soft);margin-top:5px}
  .send{width:100%;border:0;border-radius:16px;padding:16px;font-size:17px;font-family:var(--serif);font-weight:700;letter-spacing:.02em;
    background:linear-gradient(135deg,#e7b48a,#c98b5e);color:#fff;box-shadow:0 10px 24px rgba(201,139,94,.35)}
  .send:disabled{opacity:.55}
  .err{color:#c0623a;font-size:14px;margin:10px 0 0;min-height:1em}
  .done{text-align:center;padding:30px 10px 10px}
  .done .candle{width:64px;height:88px}
  .done h2{font-family:var(--serif);margin:14px 0 8px;font-size:23px}
  .done p{color:var(--ink-soft);line-height:1.8}
  .again{margin-top:20px;border:1px solid var(--gold-soft);background:#fffdf9;color:var(--ink);padding:11px 24px;border-radius:999px;font-size:15px}
  .phone .hero{height:180px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
 *  설정 — Firebase Realtime Database 설정을 붙여넣으면 실제 모드로 동작합니다.
 *  null 이면 "체험 모드": 이 브라우저 안에서만 저장되고, 오른쪽에 가상 휴대폰이 나타납니다.
 * ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQhgy2St3fMPrMGySvHwBZAnmM-sUIvDQ",
  authDomain: "jimjjak-club.firebaseapp.com",
  databaseURL: "https://jimjjak-club-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jimjjak-club",
  storageBucket: "jimjjak-club.firebasestorage.app",
  messagingSenderId: "782181002914",
  appId: "1:782181002914:web:a72c44ab05966761ca31fb"
};
/* 예시)
const FIREBASE_CONFIG = {
  apiKey: "AIza...",
  authDomain: "my-jimjjak.firebaseapp.com",
  databaseURL: "https://my-jimjjak-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-jimjjak",
  appId: "1:..."
};
*/
const MAX_NICK = 20;
const MAX_BURDEN = 60;
const MAX_STORY = 400;
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
const DEMO = !FIREBASE_CONFIG;
const MODE = new URLSearchParams(location.search).get('m') === 'write' ? 'write' : 'wall';

/* ── 아이콘 ── */
const BAG = `<svg class="bag" viewBox="0 0 48 40" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="40" height="24" rx="6"/><path d="M17 12V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v4"/></svg>`;
const WAVE = `<svg class="wave" viewBox="0 0 300 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 20C70 4 120 26 190 14S270 8 294 12"/></svg>`;
const LOGO = (cls = '') => `<div class="logo ${cls}">${BAG}<div class="word">짐짝클럽</div>${WAVE}</div>`;
const CANDLE = `<svg class="candle" viewBox="0 0 70 96" fill="none">
  <defs><radialGradient id="g" cx="50%" cy="40%" r="50%"><stop offset="0" stop-color="#ffe7c4"/><stop offset="1" stop-color="#ffe7c4" stop-opacity="0"/></radialGradient></defs>
  <circle cx="35" cy="26" r="26" fill="url(#g)"/>
  <path d="M35 10c5 7 6 12 0 20-6-8-5-13 0-20z" fill="#f6b56c"/><path d="M35 17c2 4 2 7 0 11-2-4-2-7 0-11z" fill="#fff6e3"/>
  <rect x="34" y="30" width="2" height="6" fill="#6a5444"/>
  <rect x="14" y="36" width="42" height="50" rx="7" fill="#fff8ec" stroke="#e5cfb4" stroke-width="2"/>
  <path d="M14 46h42" stroke="#efdcc4" stroke-width="2"/></svg>`;

/* ── 브라우저 저장소 (막혀 있어도 동작하도록) ── */
const mem = {};
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return k in mem ? mem[k] : d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { mem[k] = v; } }
};

/* ── 저장소: Firebase 또는 체험용 로컬 ── */
async function createStore() {
  if (!DEMO) {
    const V = '10.12.2';
    const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const { getDatabase, ref, push, onValue, serverTimestamp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-database.js`);
    const db = getDatabase(initializeApp(FIREBASE_CONFIG));
    return {
      subscribe(cb) {
        const toList = v => Object.entries(v || {}).map(([id, x]) => ({ id, ...x })).sort((a, b) => (a.at || 0) - (b.at || 0));
        // 1) 실시간 연결
        onValue(ref(db, 'items'), snap => cb(toList(snap.val())));
        // 2) 네트워크가 실시간 연결을 막는 경우를 대비해 3초마다 직접 확인
        const url = FIREBASE_CONFIG.databaseURL.replace(/\/$/, '') + '/items.json';
        setInterval(() => {
          fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : undefined).then(v => { if (v !== undefined) cb(toList(v)); }).catch(() => {});
        }, 3000);
      },
      send({ nick, burden, story }) {
        const data = { burden, at: serverTimestamp() };
        if (story) data.story = story;
        if (nick) data.nick = nick;
        return push(ref(db, 'items'), data);
      },
      status(cb) { onValue(ref(db, '.info/connected'), snap => cb(snap.val() ? 'on' : 'off')); },
      clearAll: null // 실제 모드에서는 화면만 비웁니다(데이터는 Firebase 콘솔에서 삭제)
    };
  }
  const KEY = 'jimjjak-demo-items';
  const subs = [];
  const emit = () => subs.forEach(cb => cb(ls.get(KEY, [])));
  window.addEventListener('storage', e => { if (e.key === KEY) emit(); });
  return {
    subscribe(cb) { subs.push(cb); cb(ls.get(KEY, [])); },
    async send({ nick, burden, story }) {
      await new Promise(r => setTimeout(r, 350));
      const items = ls.get(KEY, []);
      items.push({ id: Math.random().toString(16).slice(2, 14), nick, burden, story, at: Date.now() });
      ls.set(KEY, items); emit();
    },
    status(cb) { cb('demo'); },
    clearAll() { ls.set(KEY, []); emit(); }
  };
}

/* ── 입력 폼 (참여자 휴대폰) ── */
function mountForm(root, store) {
  root.innerHTML = `
    <div class="write-page">
      <div class="hero"></div>
      <div class="write">
        <form>
          <h1>올 한 해,<br>어떤 <em>짐짝</em>을 안고 계셨나요?</h1>
          <p class="lead">자신의 짐짝을 외면하지 않고 마주하는 순간부터, 새로운 도전은 이미 시작되고 있는지도 몰라요. 당신의 짐짝과 그 안에서 발견한 것을 들려주세요.</p>
          <div class="field">
            <label>닉네임 <small>(선택)</small></label>
            <input name="nick" maxlength="${MAX_NICK}" placeholder="비워두면 익명의 짐꾼" autocomplete="off">
          </div>
          <div class="field">
            <label>올 한 해 안고 있던 짐짝은?</label>
            <textarea name="burden" rows="2" maxlength="${MAX_BURDEN}" placeholder="예) 오랫동안 내려놓지 못했던 마음"></textarea>
            <div class="meta"><span data-c="burden">0</span> / ${MAX_BURDEN}</div>
          </div>
          <div class="field">
            <label>그 짐짝을 통해 무엇을 발견했나요? <small>(선택)</small></label>
            <textarea name="story" rows="5" maxlength="${MAX_STORY}" placeholder="조금씩 내려놓게 된 것, 새롭게 깨달은 것, 찾아가고 있는 나만의 길… 무엇이든 좋아요."></textarea>
            <div class="meta"><span data-c="story">0</span> / ${MAX_STORY}</div>
          </div>
          <button class="send" type="submit">짐짝 내려놓기</button>
          <p class="err"></p>
        </form>
        <div class="done" hidden>
          ${CANDLE}
          <h2>짐짝이 잘 도착했어요</h2>
          <p>마주한 그 순간부터,<br>새로운 도전은 이미 시작됐어요.<br>올 한 해, 정말 수고 많으셨어요.</p>
          <button class="again" type="button">하나 더 보내기</button>
        </div>
      </div>
    </div>`;
  const form = root.querySelector('form'), done = root.querySelector('.done');
  const nick = form.nick, burden = form.burden, story = form.story, btn = form.querySelector('.send'), err = form.querySelector('.err');
  const upd = () => { root.querySelector('[data-c=burden]').textContent = burden.value.length; root.querySelector('[data-c=story]').textContent = story.value.length; };
  burden.oninput = story.oninput = upd;
  form.onsubmit = e => {
    e.preventDefault();
    err.textContent = '';
    const n = nick.value.trim(), b = burden.value.trim(), s = story.value.trim();
    if (!b) { err.textContent = '안고 있던 짐짝을 적어주세요.'; burden.focus(); return; }
    btn.disabled = true; btn.textContent = '보내는 중…';
    store.send({ nick: n.slice(0, MAX_NICK), burden: b.slice(0, MAX_BURDEN), story: s.slice(0, MAX_STORY) })
      .then(() => { burden.value = story.value = ''; upd(); form.hidden = true; done.hidden = false; root.scrollTop = 0; })
      .catch(() => { err.textContent = '전송에 실패했어요. 잠시 후 다시 시도해주세요.'; })
      .finally(() => { btn.disabled = false; btn.textContent = '짐짝 내려놓기'; });
  };
  root.querySelector('.again').onclick = () => { done.hidden = true; form.hidden = false; burden.focus(); };
}

/* ── 대형 화면 ── */
function mountWall(root, store) {
  const writeUrl = location.origin + location.pathname + '?m=write';
  const bokeh = Array.from({ length: 14 }, () => {
    const s = 60 + Math.random() * 180;
    return `<i style="width:${s}px;height:${s}px;left:${Math.random() * 100}%;top:${Math.random() * 100}%;opacity:${.25 + Math.random() * .45};--d:${14 + Math.random() * 16}s;--x:${(Math.random() * 120 - 60) | 0}px;--y:${(Math.random() * 120 - 60) | 0}px"></i>`;
  }).join('');
  root.innerHTML = `
    <div class="stage">
      <div class="bokeh">${bokeh}</div>
      <div class="wall ${DEMO ? 'demo' : ''}">
        <aside class="side">
          <div class="brand">${LOGO()}</div>
          <h1>올 한 해,<br>어떤 <em>짐짝</em>을<br>안고 계셨나요?</h1>
          <p>짐짝이 사라지지 않았다고 해서,<br>우리가 지고 있는 것은 아니라는 것.</p>
          <div class="qr"><div id="qrcode"></div><div class="cap">QR을 찍어 당신의 짐짝을 들려주세요</div><div class="url"></div></div>
          <div class="count"><b id="count">0</b>개의 짐짝을 마주했어요</div>
          <div class="tools"><button class="btn-ghost" id="reset">초기화</button><span class="mode" id="mode"></span></div>
        </aside>
        <main class="board">
          <div class="empty" id="empty">${CANDLE}<div>마주하는 순간부터,<br>새로운 도전은 이미 시작되고 있어요.</div></div>
          <div class="grid" id="grid"></div>
        </main>
        ${DEMO ? `<aside class="phone-col"><div class="tag">체험용 휴대폰 · QR로 접속한 화면</div><div class="phone"><div class="screen" id="phone"></div></div></aside>` : ''}
      </div>
    </div>`;

  root.querySelector('.qr .url').textContent = writeUrl;
  if (window.QRCode) new QRCode(root.querySelector('#qrcode'), { text: writeUrl, width: 512, height: 512, colorDark: '#4e3b2c', colorLight: '#fffdf9', correctLevel: QRCode.CorrectLevel.M });
  if (DEMO) mountForm(root.querySelector('#phone'), store);

  // 화면 상태(초기화 시점, 숨긴 카드)는 이 브라우저에만 저장
  const VIEW = 'jimjjak-view';
  let view = ls.get(VIEW, { resetAt: 0, hidden: [] });
  const grid = root.querySelector('#grid'), empty = root.querySelector('#empty'), count = root.querySelector('#count');
  let all = [], shown = new Set(), lastSig = null, first = true;

  const palette = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) | 0; return 'p' + (Math.abs(h) % 5); };

  function card(item, isNew) {
    const el = document.createElement('article');
    el.className = 'card ' + palette(item.id) + (isNew ? ' new' : '');
    el.innerHTML = `<div class="handle"></div><div class="body"><div class="tag"></div><div class="burden"></div><div class="story"></div><button class="del" title="이 짐짝 숨기기">×</button></div><i class="wheel l"></i><i class="wheel r"></i>`;
    el.querySelector('.tag').textContent = (item.nick || '익명의 짐꾼') + '의 짐짝';
    el.querySelector('.burden').textContent = item.burden;
    el.querySelector('.story').textContent = item.story || '';
    el.querySelector('.del').onclick = () => { view.hidden.push(item.id); ls.set(VIEW, view); render(); };
    return el;
  }

  function render() {
    const items = all.filter(i => (i.at || 0) > view.resetAt && !view.hidden.includes(i.id));
    const sig = items.map(i => i.id).join(',');
    if (sig === lastSig) return;
    lastSig = sig;
    const frag = document.createDocumentFragment();
    [...items].reverse().forEach(i => frag.appendChild(card(i, !first && !shown.has(i.id))));
    grid.replaceChildren(frag);
    shown = new Set(all.map(i => i.id));
    count.textContent = items.length;
    empty.hidden = items.length > 0;
    first = false;
  }

  store.subscribe(items => { all = items; render(); });
  const modeEl = root.querySelector('#mode');
  const MODE_TEXT = { on: '실시간 연결됨', off: '3초마다 확인 중', demo: '체험 모드 · 이 브라우저에만 저장' };
  store.status(st => { modeEl.className = 'mode ' + st; modeEl.textContent = MODE_TEXT[st]; });

  // 초기화: 두 번 눌러야 실행
  const btn = root.querySelector('#reset');
  let timer;
  btn.onclick = () => {
    if (!btn.classList.contains('armed')) {
      btn.classList.add('armed'); btn.textContent = '한 번 더 누르면 모두 지움';
      timer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '초기화'; }, 3000);
      return;
    }
    clearTimeout(timer);
    btn.classList.remove('armed'); btn.textContent = '초기화';
    view = { resetAt: Date.now(), hidden: [] };
    ls.set(VIEW, view);
    if (store.clearAll) store.clearAll();
    render();
  };
}

const app = document.getElementById('app');
try {
  const store = await createStore();
  MODE === 'write' ? mountForm(app, store) : mountWall(app, store);
} catch (e) {
  app.innerHTML = '<p style="padding:40px;text-align:center">연결에 실패했어요. Firebase 설정을 확인해주세요.</p>';
  console.error(e);
}
</script>
</body>
</html>
